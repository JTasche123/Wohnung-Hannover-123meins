name: Wohnungscheck

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Test-Benachrichtigung senden"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: wohnungscheck

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seiten prüfen
        run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test }}

      - name: Zustand speichern
        run: |
          git config user.name "wohnungsbot"
          git config user.email "wohnungsbot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push)
